name: Build CloudRedirect (S3 fork)

# Personal build helper: compiles the S3/Backblaze-enabled fork of
# CloudRedirect vendored under third_party/CloudRedirect/, and uploads
# cloud_redirect.dll as a downloadable artifact. Not part of the
# OpenSteamTool product build.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/salit-kt7np0]
    paths:
      - 'third_party/CloudRedirect/**'
      - '.github/workflows/build_cloud_redirect_s3.yml'

jobs:
  build:
    name: Build cloud_redirect.dll (Release)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S third_party/CloudRedirect -B third_party/CloudRedirect/build -G "Ninja Multi-Config"

      - name: Build cloud_redirect.dll
        run: cmake --build third_party/CloudRedirect/build --config Release --target cloud_redirect

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud_redirect-s3-dll
          path: third_party/CloudRedirect/build/Release/cloud_redirect.dll
          retention-days: 7

      - name: Publish stable download (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: s3-dll-latest
          name: cloud_redirect.dll (S3/Backblaze fork, latest)
          body: |
            Auto-published by .github/workflows/build_cloud_redirect_s3.yml.
            Not an official CloudRedirect release - a personal fork with an
            added S3-compatible provider. This tag is overwritten on every
            build; the asset URL below stays stable.
          files: third_party/CloudRedirect/build/Release/cloud_redirect.dll
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
